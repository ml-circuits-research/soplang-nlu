# Fine-tuning en_core_web_trf 3.8 (tagger + parser + the transformer under them) on trees converted from gold circuits.
[paths]
train = null
dev = null
base = "/tmp/sop-nlu-trf-model/en_core_web_trf/en_core_web_trf-3.8.0"
vectors = null
init_tok2vec = null

[system]
gpu_allocator = "pytorch"
seed = 1

[nlp]
lang = "en"
pipeline = ["transformer","tagger","parser","attribute_ruler","lemmatizer"]
batch_size = 64
tokenizer = {"@tokenizers":"spacy.Tokenizer.v1"}

[components]

[components.transformer]
source = ${paths.base}

[components.tagger]
source = ${paths.base}

[components.parser]
source = ${paths.base}

[components.attribute_ruler]
source = ${paths.base}

[components.lemmatizer]
source = ${paths.base}

[corpora]

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
gold_preproc = false
max_length = 0
limit = 0

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
gold_preproc = false
max_length = 0
limit = 0

[training]
train_corpus = "corpora.train"
dev_corpus = "corpora.dev"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
patience = 0
max_epochs = 0
max_steps = 1200
eval_frequency = 200
frozen_components = ["attribute_ruler","lemmatizer"]
annotating_components = []
before_to_disk = null
before_update = null

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
size = 1000
tolerance = 0.2
get_length = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = true
eps = 0.00000001

[training.optimizer.learn_rate]
@schedules = "warmup_linear.v1"
warmup_steps = 100
total_steps = 1200
initial_rate = 0.00002

[training.score_weights]
tag_acc = 0.33
dep_uas = 0.0
dep_las = 0.67
dep_las_per_type = null
sents_f = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
before_init = null
after_init = null

[initialize.components]

[initialize.tokenizer]
